<style>

html[data-theme="plum"]{--accent-1:#86307F;--accent-h:#6F2869;--accent-tx:#5E2259;--accent-rgb:134,48,127;--edge:#E8DCE8;--edge-strong:#C9A2C5;--tint:#EEE2ED;--side:#F9F5F9;--callout:#F6EFF5;--wash:#FBF8FB;--wash2:#F9F5F9;--track:#F4ECF3;--line-rgb:80,29,76;--chart-a:#86307F;--chart-b:#D383C9;--deep:#3C1C41;--page2:#FAF7FA;--cardedge:#EAE1EA;--blue:var(--accent-1);--blue-h:var(--accent-h);--blue-soft:rgba(var(--accent-rgb),.16);--brand:var(--accent-1)}

:root{
  --ink:rgb(55,53,47); --ink2:rgba(55,53,47,.65); --ink3:rgba(55,53,47,.45);
  --line:rgba(var(--line-rgb),.10); --line2:rgba(var(--line-rgb),.18); --hover:rgba(var(--accent-rgb),.07); --hover2:rgba(var(--accent-rgb),.12);
  --page:#FFFFFF;
  
  --green-bg:#DBEDDB; --green-tx:#1C3829; --red-bg:#FFE2DD; --red-tx:#5D1715; --yellow-bg:#FDECC8; --yellow-tx:#402C1B; --grey-bg:#E3E2E0; --grey-tx:#32302C;
  --red:#B3433B;
  --font:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI Variable Display","Segoe UI",Helvetica,Arial,sans-serif;
  /* aliases used by older markup */
  --accent:var(--accent-1); --accent-soft:var(--green-bg); --yellow-soft:var(--yellow-bg); --red-soft:var(--red-bg); --grid:var(--line2); --muted:var(--ink2);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;min-height:100%;background:var(--page);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
h1,h2,h3{margin:0}
.app{display:flex;min-height:100vh}
/* Sidebar */
.side{position:sticky;top:0;height:100vh;height:100dvh;overflow-y:auto;align-self:flex-start;box-sizing:border-box;width:240px;flex:0 0 240px;background:var(--side);border-right:1px solid var(--edge);display:flex;flex-direction:column;padding:8px 6px}
.ws{display:flex;align-items:center;gap:8px;padding:6px 10px;margin-bottom:10px;font-weight:600;font-size:14px;border-radius:6px}
.ws .sub{font-weight:400;color:var(--ink3);font-size:12px;margin-left:auto}
.nav{display:flex;flex-direction:column;gap:1px}
.nav .grp{font-size:12px;font-weight:500;color:var(--ink3);padding:12px 10px 4px}
.nav a{display:flex;align-items:center;gap:8px;padding:5px 10px;border-radius:6px;color:var(--ink2);text-decoration:none;font-weight:500;min-height:32px}
.nav a:hover{background:var(--hover)}
.nav a[aria-current="page"]{background:var(--tint);color:var(--accent-tx)}
.nav a[aria-current="page"] svg{color:var(--accent-1)}
.nav a svg{flex:0 0 18px;color:var(--ink3)}
.nav .tag{margin-left:auto;font-size:11px;font-weight:500;color:var(--ink3)}
.side-foot{margin-top:auto;padding:8px 10px;font-size:12px;color:var(--ink3);display:flex;gap:8px;align-items:center}
.dot{width:7px;height:7px;border-radius:50%;flex:0 0 7px;background:#ccc}
.dot.ok{background:#4DAB9A}.dot.warn{background:#DFAB01}.dot.bad{background:var(--red)}
/* Main */
.mainwrap{flex:1 1 auto;min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:20;background:var(--page);height:45px;flex:0 0 45px;display:flex;align-items:center;gap:12px;padding:0 14px}
.crumb{font-size:14px;color:var(--ink);display:flex;gap:6px;align-items:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumb .sep{color:var(--ink3)}
.crumb .muted{color:var(--ink2)}
.status{margin-left:auto;font-size:13px;color:var(--ink3);display:flex;gap:8px;align-items:center;white-space:nowrap}
.sum{display:none}
.work{flex:1 1 auto;position:relative}
.work:focus{outline:none}
.page{max-width:1180px;margin:0 auto;padding:36px 64px 96px}
.ph{margin-bottom:14px}
.picon{width:56px;height:56px;border-radius:12px;display:grid;place-items:center;background:var(--callout);color:var(--brand);margin-bottom:12px}
.ph h1{font-size:36px;font-weight:700;line-height:1.2;letter-spacing:-.01em}
.ph .desc{color:var(--ink2);margin:6px 0 0;font-size:15px}
/* database toolbar */
.dbbar{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:6px 0;border-bottom:1px solid var(--line);margin-bottom:0;min-height:44px}
.dbbar .view{display:flex;align-items:center;gap:6px;font-weight:500;padding:4px 8px;border-bottom:2px solid var(--brand);color:var(--accent-tx);margin-bottom:-7px;padding-bottom:8px}
.dbbar .grow{flex:1 1 auto}
.dbbar .sep{width:1px;height:20px;background:var(--line2);margin:0 4px}
.dbbar label.inl{display:flex;align-items:center;gap:4px;font-size:13px;color:var(--ink2);padding:2px 4px;border-radius:6px}
.dbbar label.inl:hover{background:var(--hover)}
.dbbar select{border:0;background:transparent;font-size:13px;color:var(--ink);padding:4px 2px;min-height:28px;cursor:pointer;max-width:200px}
.dbbar input[type=checkbox]{accent-color:var(--blue)}
.dbbar .small{color:var(--ink2)}
.dbbar strong{font-weight:500}
/* Home */
.hello{background:var(--callout);border:1px solid var(--edge);border-radius:12px;padding:28px;margin-top:8px}
.hello h2{font-size:24px;font-weight:700;margin-bottom:8px}
.hello p{margin:0 0 4px;font-size:15px;max-width:640px}
.hello-form{margin-top:18px;max-width:560px}
.hello-form label.f{font-size:14px;color:var(--ink)}
.hello-form input{width:100%;min-height:44px;padding:8px 12px;border:0;box-shadow:inset 0 0 0 1px var(--line2);border-radius:8px;background:#fff;font-size:16px}
.btn.big{min-height:44px;padding:0 18px;font-size:15px;border-radius:8px}
.how{margin-top:28px}
.how h3{font-size:16px;font-weight:600;margin-bottom:10px}
.howlist{list-style:none;counter-reset:h;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.howlist li{counter-increment:h;border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:4px}
.howlist li::before{content:counter(h);width:26px;height:26px;border-radius:50%;background:var(--tint);color:var(--accent-tx);display:grid;place-items:center;font-weight:600;font-size:13px;margin-bottom:6px}
.howlist span{color:var(--ink2);font-size:13px}
.sect{font-size:13px;font-weight:600;color:var(--ink2);margin:26px 0 10px;letter-spacing:.01em}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.tile{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:16px;border:1px solid var(--line2);border-radius:12px;background:#fff;cursor:pointer;text-align:left;text-decoration:none;color:var(--ink);min-height:120px;transition:border-color .12s,box-shadow .12s}
.tile:hover{border-color:var(--brand);box-shadow:0 2px 10px rgba(var(--accent-rgb),.12)}
.tile .ti{width:44px;height:44px;border-radius:10px;background:var(--callout);color:var(--brand);display:grid;place-items:center;margin-bottom:6px}
.tile .tt{font-weight:600;font-size:15px}
.tile .ts{font-size:13px;color:var(--ink2)}
.tile .badge{position:absolute;top:12px;right:12px;min-width:22px;height:22px;border-radius:11px;background:#B3433B;color:#fff;font-size:12px;font-weight:600;display:grid;place-items:center;padding:0 6px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.stats .stat{display:flex;flex-direction:column;gap:2px;padding:16px;border-radius:12px;background:var(--callout);border:1px solid var(--edge);text-decoration:none;color:var(--ink)}
.stats .stat:hover{border-color:var(--brand)}
.stats .k{font-size:13px;color:var(--ink2)}
.stats .v{font-size:26px;font-weight:700;letter-spacing:-.01em}
.stats .s{font-size:13px;color:var(--brand)}
.owelist{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.oweitem{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:16px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.oweitem:last-child{border-bottom:0}
.oweitem .amt{font-size:17px;font-weight:600}
.guide{border:1px solid var(--edge);background:#fff;border-radius:12px;padding:16px 18px;margin-top:6px}
.guide-h{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.guide-h h2{font-size:17px;font-weight:600}
.guide .bar{flex:1 1 120px;height:6px;border-radius:3px;background:var(--track);overflow:hidden;max-width:240px}
.guide .bar span{display:block;height:100%;background:var(--brand);border-radius:3px}
.guide-h .btn.link{margin-left:auto}
.steps2{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:2px}
.steps2 li{display:flex;align-items:center;gap:12px;padding:8px 10px;border-radius:8px}
.steps2 li svg{flex:0 0 16px}
.steps2 li > div{flex:1 1 auto}
.steps2 li.done .strong{color:var(--ink3);text-decoration:line-through;font-weight:400}
.steps2 li.next{background:var(--callout)}
/* Month calendar */
.seg{display:inline-flex;background:var(--track);border-radius:8px;padding:2px}
.seg button{border:0;background:transparent;padding:4px 12px;border-radius:6px;font-size:13px;font-weight:500;color:var(--ink2);cursor:pointer;min-height:28px}
.seg button.on{background:#fff;color:var(--accent-tx);box-shadow:0 1px 2px rgba(15,15,15,.1)}
.monthname{min-width:140px;text-align:center;font-weight:600;font-size:15px}
.calsum{display:flex;flex-wrap:wrap;align-items:center;gap:6px 18px;padding:12px 0;font-size:14px;color:var(--ink2)}
.calsum b{color:var(--ink);font-weight:600}
.calsum b.owed{color:var(--red)}
.calsum .miss{color:#8A5A00;background:#FDF3D6;padding:2px 8px;border-radius:10px;font-size:13px}
.calsum .grow{flex:1 1 auto}
.cal{border:1px solid var(--line2);border-radius:10px;overflow:hidden;background:#fff}
.cal-h,.cal-w{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.cal-h div{padding:8px 10px;font-size:12px;font-weight:500;color:var(--ink2);background:var(--wash);border-bottom:1px solid var(--line)}
.cal-d{min-height:118px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px 6px 8px;display:flex;flex-direction:column;gap:3px;cursor:pointer;min-width:0}
.cal-w .cal-d:nth-child(7){border-right:0}
.cal-w:last-child .cal-d{border-bottom:0}
.cal-d:hover{background:var(--wash)}
.cal-d.we{background:var(--wash)}
.cal-d.out{background:#FAFAF8}
.cal-d.out .dn{color:var(--ink3)}
.cal-dh{display:flex;align-items:center;justify-content:space-between;margin-bottom:2px}
.dn{font-size:13px;font-weight:500;width:24px;height:24px;display:grid;place-items:center;border-radius:50%}
.cal-d.today .dn{background:var(--brand);color:#fff}
.addday{border:0;background:transparent;color:transparent;width:24px;height:24px;border-radius:6px;font-size:16px;line-height:1;cursor:pointer}
.cal-d:hover .addday,.addday:focus-visible{color:var(--ink2)}
.addday:hover{background:var(--hover2)}
.chip{display:flex;align-items:center;gap:5px;width:100%;min-width:0;border:0;border-radius:5px;padding:3px 6px;font-size:12.5px;text-align:left;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3}
.chip .tm{color:inherit;opacity:.9;font-variant-numeric:tabular-nums}
.chip .dotc{width:7px;height:7px;border-radius:50%;flex:0 0 7px}
.chip.paid{background:var(--green-bg);color:var(--green-tx)} .chip.paid .dotc{background:#448361}
.chip.part{background:var(--yellow-bg);color:var(--yellow-tx)} .chip.part .dotc{background:#CB912F}
.chip.unpaid{background:var(--red-bg);color:var(--red-tx)} .chip.unpaid .dotc{background:#D44C47}
.chip.free{background:var(--grey-bg);color:var(--grey-tx)} .chip.free .dotc{background:#9B9A97}
.chip.plan{background:#fff;color:var(--ink2);box-shadow:inset 0 0 0 1px var(--line2);border:1px dashed transparent}
.chip.plan.due{box-shadow:none;border:1px dashed var(--edge-strong);color:var(--accent-tx);background:var(--wash2)}
.chip.plan .plus{margin-left:auto;font-size:11px;font-weight:600;color:var(--brand)}
.chip:hover{filter:brightness(.97)}
.chip.static{display:inline-flex;width:auto;cursor:default}
.calsum .legend{gap:6px}
.namebtn{border:0;background:none;padding:0;font:inherit;font-weight:500;color:inherit;cursor:pointer;text-align:left;text-decoration:underline;text-decoration-color:rgba(var(--accent-rgb),.35);text-underline-offset:3px}
.namebtn:hover{color:var(--brand);text-decoration-color:var(--brand)}
.statline{display:flex;align-items:center;gap:10px;background:var(--callout);border-radius:8px;padding:8px 10px;margin-bottom:14px}
.statline .btn{margin-left:auto}
.card-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:14px 0}
.card-stats div{background:var(--callout);border-radius:8px;padding:8px 10px;display:flex;flex-direction:column}
.card-stats .k{font-size:12px;color:var(--ink2)}
.card-stats .v{font-weight:600;font-size:15px}
.card-h3{font-size:14px;font-weight:600;margin:6px 0 6px}
.card-list{border:1px solid var(--line);border-radius:8px}
.card-row{display:grid;grid-template-columns:90px minmax(0,1fr) 60px auto;gap:10px;align-items:center;padding:7px 10px;border-bottom:1px solid var(--line);font-size:13.5px}
.card-row:last-child{border-bottom:0}
.card-row span:nth-child(3){text-align:right}
.topnew{margin-left:4px}
.qty{display:inline-flex;align-items:center;gap:2px;border:1px solid var(--line2);border-radius:7px;padding:1px;background:#fff}
.qty button{width:24px;height:24px;border:0;border-radius:5px;background:transparent;cursor:pointer;font-size:15px;line-height:1;color:var(--ink2)}
.qty button:hover:not([disabled]){background:var(--hover2);color:var(--ink)}
.qty button[disabled]{opacity:.35;cursor:default}
.qty b{min-width:20px;text-align:center;font-weight:600}
/* Charts */
.chartcard{border:1px solid var(--line2);border-radius:12px;padding:16px 18px 12px;background:#fff;margin-top:16px;min-width:0}
.chart-h{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:8px;flex-wrap:wrap}
.chart-h h3{font-size:16px;font-weight:600}
.chart-h .small{margin:2px 0 0}
.chartgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 16px}
.chart{width:100%;height:auto;display:block;font-family:var(--font)}
.chart .hit{fill:transparent;cursor:default;outline:none}
.chart .hit:hover,.chart .hit:focus{fill:rgba(var(--accent-rgb),.06)}
.chart .hitg line,.chart .hitg circle{opacity:0;transition:opacity .1s}
.chart .hitg:hover line,.chart .hitg:hover circle,.chart .hitg:focus-within line,.chart .hitg:focus-within circle{opacity:1}
.clegend{display:flex;gap:14px;font-size:13px;color:var(--ink2);align-items:center}
.clegend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.hbars{display:flex;flex-direction:column;gap:6px;padding:4px 0 6px}

.nav a[aria-current="page"]{background:rgba(30,170,107,.24);color:#fff;box-shadow:inset 3px 0 0 #1EAA6B}

.nav a[aria-current="page"] .tag,.nav a[aria-current="page"] small{color:#A9E8CA}
.sidelog{margin:16px 6px 6px;width:calc(100% - 12px);min-height:40px;justify-content:center;font-weight:600;font-size:14px;border-radius:6px;
  background:#1EAA6B;color:#fff;border:0;cursor:pointer;
  transition:background .12s}
.sidelog:hover{background:#179259}
.sidelog:active{background:#14804C}
.side-foot{color:#71818D}

/* ---- Topbar ---- */
.topbar{background:#fff;border-bottom:1px solid var(--edge)}
.topnew{font-weight:600;border-radius:6px}

/* ---- Type: plain, confident, no display font ---- */
h1,.block-h,.sect,.panel h2,.hello h2,.guide h2,.dbbar .view{font-family:var(--font);font-weight:700;letter-spacing:-.005em}
.ph h1{font-size:32px}
.ph .picon{border-radius:8px;background:var(--tint);color:var(--accent-tx)}
.sect{color:var(--ink3);text-transform:uppercase;letter-spacing:.07em;font-size:11.5px}

/* ---- Panels: white cards, 1px borders, small radii ---- */
.panel,.guide,.tile,.chartcard,.owelist,.howlist li{background:#fff;border:1px solid var(--cardedge);border-radius:10px;box-shadow:0 1px 2px rgba(16,24,20,.05)}
.hello{background:#fff;border:1px solid var(--cardedge);border-radius:10px;color:var(--ink)}
.hello h2{color:var(--accent-tx)}
.hello p,.hello .small{color:var(--ink2)}
.hello .btn.primary{background:#1EAA6B;color:#fff}
.hello .btn.primary:hover{background:#179259}
.hello .btn.outline{color:var(--accent-tx);box-shadow:inset 0 0 0 1px var(--edge-strong);background:#fff}
.hello .btn.outline:hover{background:var(--tint)}
.hello-form input{border-radius:6px}
.stats .stat{background:#fff;border:1px solid var(--cardedge);border-radius:10px}
.stats .v{font-weight:700;font-size:24px;color:var(--accent-tx);font-variant-numeric:lining-nums tabular-nums}
.stats .k{font-weight:600;color:var(--ink2)}
.stats .s{color:var(--accent-tx);font-weight:600}
.tile{transition:border-color .12s,box-shadow .12s}
.tile:hover{border-color:var(--accent-1);box-shadow:0 2px 8px rgba(30,170,107,.14)}
.tile .ti{border-radius:8px;background:var(--tint);color:var(--accent-tx)}
.howlist li{border-radius:8px}
.howlist li::before{background:var(--tint);color:var(--accent-tx);border-radius:6px;font-weight:700}
.owelist{border-radius:10px}
.oweitem{border-bottom:1px solid var(--wash2)}
.oweitem:last-child{border-bottom:0}
.oweitem .amt{font-weight:700;color:var(--accent-tx)}

/* ---- Buttons: solid, quiet ---- */
.btn{border-radius:6px;font-weight:600;transition:background .12s,box-shadow .12s}
.btn.primary{background:#1EAA6B;color:#fff;border:0}
.btn.primary:hover{background:#179259}
.btn.primary:active{background:#14804C}
.btn.outline{box-shadow:inset 0 0 0 1px var(--edge-strong);color:var(--accent-tx);background:#fff}
.btn.outline:hover{background:var(--tint)}
.btn.link{color:var(--accent-tx);font-weight:600}
.btn.link:hover{text-decoration:underline}

/* ---- Tables ---- */
table.g{background:#fff;border:1px solid var(--cardedge);border-radius:10px;border-collapse:separate;border-spacing:0;overflow:hidden}
table.g thead th{background:#F0F5F2;font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink2);box-shadow:none}
table.g th,table.g td{border-right:0;border-bottom:1px solid var(--wash2)}
table.g tr:last-child td{border-bottom:0}
table.g tbody tr:hover td{background:#F7FAF8}

/* ---- Dialogs and toasts: quick, quiet motion ---- */
@keyframes q-pop{from{transform:scale(.985) translateY(6px);opacity:0}to{transform:scale(1) translateY(0);opacity:1}}
dialog{border:1px solid var(--cardedge);border-radius:12px;box-shadow:0 16px 48px rgba(16,24,20,.22);animation:q-pop .16s ease-out}
dialog::backdrop{background:rgba(16,24,20,.42)}
@keyframes q-toast{from{transform:translateY(10px);opacity:0}to{transform:translateY(0);opacity:1}}
#toast{background:#1D252D;color:#fff;border-radius:8px;font-weight:600;box-shadow:0 6px 20px rgba(16,24,20,.3);animation:q-toast .18s ease-out}

/* ---- Premium, streak, status ---- */
.q-streak{display:inline-flex;align-items:center;gap:6px;background:#fff;color:var(--accent-tx);font-weight:600;font-size:12.5px;border-radius:999px;padding:3px 11px 3px 9px;border:1px solid #C9DED2}
.premium-tag{background:var(--tint);color:var(--accent-tx);border-radius:4px;font-weight:700;font-size:10.5px;padding:2px 7px;letter-spacing:.03em;text-transform:uppercase}
.pteaser{background:var(--callout);border:1px dashed var(--edge-strong);border-radius:10px}
.badge{background:#D64A3D}
.dot{background:#C3CCC7}
.dot.ok{background:#1EAA6B}.dot.warn{background:#E8A13C}.dot.bad{background:#D64A3D}

/* ---- Charts ---- */
.chartcard{border-radius:10px}

/* ---- Mobile ---- */
@media (max-width:760px){
  .sidelog{display:none}
  .topnew{min-height:38px}
  .hello{border-radius:10px;padding:22px}
}

/* ---- Confetti canvas sits over everything, never blocks clicks ---- */
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:9999}

/* ---- Respect reduced motion ---- */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}

<script>
/* SoleTutor core logic — pure functions, no DOM. Money is always integer pence. */
var Core = (function () {
  'use strict';

  function pad(n) { return (n < 10 ? '0' : '') + n; }

  /** Local-calendar date as YYYY-MM-DD (never toISOString: that is UTC). */
  function dateStr(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function today() { return dateStr(new Date()); }
  function isDate(s) {
    if (typeof s !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(s)) return false;
    var p = s.split('-').map(Number);
    var d = new Date(p[0], p[1] - 1, p[2]);
    return d.getFullYear() === p[0] && d.getMonth() === p[1] - 1 && d.getDate() === p[2];
  }
  function addDays(s, n) {
    var p = s.split('-').map(Number);
    return dateStr(new Date(p[0], p[1] - 1, p[2] + n));
  }
  /** Whole days from a to b (b - a), DST-safe. */
  function daysBetween(a, b) {
    var pa = a.split('-').map(Number), pb = b.split('-').map(Number);
    return Math.round((Date.UTC(pb[0], pb[1] - 1, pb[2]) - Date.UTC(pa[0], pa[1] - 1, pa[2])) / 86400000);
  }

  var DOW = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  var MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  var MONTH_FULL = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
  function niceDate(s, withYear) {
    var p = s.split('-').map(Number);
    var d = new Date(p[0], p[1] - 1, p[2]);
    return DOW[d.getDay()] + ' ' + p[2] + ' ' + MON[p[1] - 1] + (withYear ? ' ' + p[0] : '');
  }
  function monthLabel(ym) { var p = ym.split('-').map(Number); return MONTH_FULL[p[1] - 1] + ' ' + p[0]; }

  /** "25", "25.5", "£1,025.50" -> pence. Returns null when not a valid non-negative amount. */
  function toPence(input) {
    if (typeof input === 'number') input = String(input);
    if (typeof input !== 'string') return null;
    // Forgiving: "£30", "30 pounds", "£25/hr", "30 per lesson", "30,50", "35." all work.
    var s = input.toLowerCase()
      .replace(/£|gbp|pounds?|quid|each|an?\s*(hour|hr|lesson|session)|per\s*(hour|hr|h|lesson|session)|\/\s*(hour|hr|h|lesson|session)|p\/h/g, '')
      .replace(/\s/g, '');
    if (/^\d+,\d{1,2}$/.test(s)) s = s.replace(',', '.'); else s = s.replace(/,/g, '');
    if (/^\d+\.$/.test(s)) s = s.slice(0, -1);
    if (!/^\d+(\.\d{1,2})?$/.test(s) && !/^\.\d{1,2}$/.test(s)) return null;
    var parts = s.split('.');
    var whole = parts[0] === '' ? 0 : parseInt(parts[0], 10);
    var frac = parts[1] ? parseInt((parts[1] + '0').slice(0, 2), 10) : 0;
    var p = whole * 100 + frac;
    return p > 100000000 ? null : p; // cap at £1,000,000
  }
  function fmt(p) {
    var neg = p < 0; p = Math.abs(p);
    var pounds = Math.floor(p / 100), pence = p % 100;
    var s = String(pounds).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    return (neg ? '−£' : '£') + s + (pence ? '.' + pad(pence) : '');
  }
  /** Plain number for inputs/CSV: 2500 -> "25.00". */
  function plain(p) { return (p / 100).toFixed(2); }

  /** UK tax year runs 6 April – 5 April. Returns the starting calendar year. */
  function taxYearOf(s) {
    var y = Number(s.slice(0, 4));
    return s.slice(5) >= '04-06' ? y : y - 1;
  }
  function taxYearLabel(y) { return y + '/' + String(y + 1).slice(2); }
  function taxYearRange(y) { return { start: y + '-04-06', end: (y + 1) + '-04-05' }; }
  function inRange(s, r) { return s >= r.start && s <= r.end; }

  function byDateThenCreated(a, b) {
    if (a.date !== b.date) return a.date < b.date ? -1 : 1;
    var ca = a.createdAt || 0, cb = b.createdAt || 0;
    if (ca !== cb) return ca - cb;
    return a.id < b.id ? -1 : a.id > b.id ? 1 : 0;
  }

  /**
   * Work out how much of each lesson has been paid.
   * 1) A payment linked to a lesson pays that lesson first.
   * 2) Everything else (unlinked payments + leftovers) pays the student's
   *    oldest unpaid lessons first.
   * Returns { paid: {lessonId: pence}, students: {studentId: summary} }.
   */
  function allocate(state) {
    var paid = {};
    var lessonsBy = {}, paymentsBy = {}, lessonById = {};
    state.lessons.forEach(function (l) {
      paid[l.id] = 0; lessonById[l.id] = l;
      (lessonsBy[l.studentId] = lessonsBy[l.studentId] || []).push(l);
    });
    state.payments.forEach(function (p) {
      (paymentsBy[p.studentId] = paymentsBy[p.studentId] || []).push(p);
    });
    var ids = {};
    state.students.forEach(function (s) { ids[s.id] = true; });
    Object.keys(lessonsBy).forEach(function (k) { ids[k] = true; });
    Object.keys(paymentsBy).forEach(function (k) { ids[k] = true; });

    var students = {};
    Object.keys(ids).forEach(function (sid) {
      var ls = (lessonsBy[sid] || []).slice().sort(byDateThenCreated);
      var ps = (paymentsBy[sid] || []).slice().sort(byDateThenCreated);
      var pool = 0, totalLessons = 0, totalPaid = 0;
      ls.forEach(function (l) { totalLessons += l.price; });
      ps.forEach(function (p) {
        totalPaid += p.amount;
        var l = p.lessonId ? lessonById[p.lessonId] : null;
        if (l && l.studentId === sid) {
          var take = Math.min(p.amount, l.price - paid[l.id]);
          paid[l.id] += take;
          pool += p.amount - take;
        } else {
          pool += p.amount;
        }
      });
      ls.forEach(function (l) {
        if (pool <= 0) return;
        var take = Math.min(pool, l.price - paid[l.id]);
        if (take > 0) { paid[l.id] += take; pool -= take; }
      });
      var unpaid = ls.filter(function (l) { return paid[l.id] < l.price; });
      students[sid] = {
        totalLessons: totalLessons,
        totalPaid: totalPaid,
        owed: Math.max(0, totalLessons - totalPaid),
        credit: Math.max(0, totalPaid - totalLessons),
        lessonCount: countLessons(ls),
        unpaidCount: countLessons(unpaid),
        unpaid: unpaid,
        oldestUnpaid: unpaid.length ? unpaid[0].date : null
      };
    });
    return { paid: paid, students: students };
  }

  /** How many lessons a row stands for (a double lesson counts as 2). */
  function qtyOf(l) { return Number.isInteger(l.qty) && l.qty >= 1 ? l.qty : 1; }
  function taughtQty(l) { return l.status === 'cancelled' || l.status === 'late' ? 0 : qtyOf(l); }
  function countLessons(list) { var n = 0; list.forEach(function (l) { n += taughtQty(l); }); return n; }

  function lessonStatus(l, paidAmt) {
    if (l.status === 'cancelled') return 'cancelled';
    if (l.status === 'makeup') return 'makeup';
    if (l.price === 0) return 'free';
    if (paidAmt >= l.price) return 'paid';
    if (paidAmt > 0) return 'part';
    return 'unpaid';
  }

  /** Money received and lessons taught inside a date range, by month and by student. */
  function income(state, range) {
    var months = {}, byStudent = {}, byMethod = {};
    var received = 0, taught = 0, taughtValue = 0;
    state.payments.forEach(function (p) {
      if (!inRange(p.date, range)) return;
      received += p.amount;
      var m = p.date.slice(0, 7);
      months[m] = months[m] || { received: 0, lessons: 0, value: 0 };
      months[m].received += p.amount;
      byStudent[p.studentId] = (byStudent[p.studentId] || 0) + p.amount;
      byMethod[p.method || 'Other'] = (byMethod[p.method || 'Other'] || 0) + p.amount;
    });
    state.lessons.forEach(function (l) {
      if (!inRange(l.date, range)) return;
      taught += taughtQty(l); taughtValue += l.price;
      var m = l.date.slice(0, 7);
      months[m] = months[m] || { received: 0, lessons: 0, value: 0 };
      months[m].lessons += taughtQty(l); months[m].value += l.price;
    });
    return { received: received, taught: taught, taughtValue: taughtValue, months: months, byStudent: byStudent, byMethod: byMethod };
  }

  /** The 12 YYYY-MM keys of a tax year, April to March. */
  function taxYearMonths(y) {
    var out = [];
    for (var i = 0; i < 12; i++) { var m = 3 + i; var yy = y + Math.floor(m / 12); out.push(yy + '-' + pad(m % 12 + 1)); }
    return out;
  }

  function reminderText(opts) {
    // opts: {studentName, parentName, tutorName, unpaid:[{date, remaining}], total}
    var hi = opts.parentName ? opts.parentName : opts.studentName;
    var n = opts.unpaid.length;
    var lines = opts.unpaid.map(function (u) { return '• ' + niceDate(u.date) + ': ' + fmt(u.remaining); });
    var who = opts.parentName ? opts.studentName + "'s" : 'your';
    var text = 'Hi ' + hi + ',\n\n' +
      'Just a friendly reminder that ' + (n === 1 ? 'payment for ' + who + ' lesson is' : 'payment for ' + n + ' of ' + who + ' lessons is') +
      ' still outstanding:\n\n' + lines.join('\n') + '\n\nTotal: ' + fmt(opts.total) + '\n\n' +
      'Thank you, and do let me know if you have any questions.\n' + (opts.tutorName ? '\n' + opts.tutorName : '');
    return text;
  }

  /** Students whose oldest unpaid lesson is at least `after` days old and who
   *  haven't been reminded in the last `after` days. Oldest debt first. */
  function remindersDue(state, alloc, today, after) {
    var out = [];
    state.students.forEach(function (s) {
      var sum = alloc.students[s.id];
      if (s.archived || !sum || sum.owed <= 0 || !sum.oldestUnpaid) return;
      if (daysBetween(sum.oldestUnpaid, today) < after) return;
      if (s.remindedAt && daysBetween(s.remindedAt, today) < after) return;
      out.push({ student: s, owed: sum.owed, since: sum.oldestUnpaid, lessons: sum.unpaidCount });
    });
    return out.sort(function (a, b) { return a.since < b.since ? -1 : a.since > b.since ? 1 : b.owed - a.owed; });
  }

  function csvCell(v) {
    var s = v == null ? '' : String(v);
    if (/^[=+\-@\t\r]/.test(s)) s = "'" + s; // stop spreadsheet formula injection
    return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }
  function toCSV(rows) { return rows.map(function (r) { return r.map(csvCell).join(','); }).join('\r\n'); }

  /** Validate + normalise imported/loaded data. Throws Error with a readable message. */
  function normalise(raw) {
    if (!raw || typeof raw !== 'object') throw new Error('This file is not a SoleTutor backup.');
    var out = { students: [], lessons: [], payments: [], expenses: [], platform: [], settings: {} };
    var sids = {};
    (Array.isArray(raw.students) ? raw.students : []).forEach(function (s) {
      if (!s || typeof s.id !== 'string' || typeof s.name !== 'string' || !s.name.trim()) return;
      sids[s.id] = true;
      out.students.push({
        id: s.id, name: s.name.trim().slice(0, 80),
        parent: typeof s.parent === 'string' ? s.parent.slice(0, 80) : '',
        phone: typeof s.phone === 'string' ? s.phone.slice(0, 40) : '',
        email: typeof s.email === 'string' ? s.email.slice(0, 120) : '',
        rate: Number.isInteger(s.rate) && s.rate >= 0 ? s.rate : 0,
        duration: Number.isInteger(s.duration) && s.duration > 0 ? s.duration : 60,
        notes: typeof s.notes === 'string' ? s.notes.slice(0, 500) : '',

  function tile(action, icon, title, sub) {

  function guide() {

      { done: state.students.length > 0, t: 'Add your first student', s: 'Their subject, usual day and price per lesson.', b: '<button class="btn xs primary" data-action="new-student">Add student</button>' },
      { done: state.lessons.length > 0, t: 'Log a lesson you’ve taught', s: 'Use “Log a lesson”, or tap the day on the Calendar.', b: '<button class="btn xs primary" data-action="new-lesson">Log lesson</button>' },
      { done: state.payments.length > 0, t: 'Mark a lesson as paid', s: 'Tick “Paid?” next to the lesson and choose cash, card or bank.', b: '<a class="btn xs primary" href="#lessons">Go to Lessons</a>' }
    ];
    var n = steps.filter(function (x) { return x.done; }).length;
    if (n === steps.length) return '';
    var h = '<section class="guide" aria-labelledby="guide-h"><div class="guide-h"><h2 id="guide-h">Getting started</h2><span class="small">' + n + ' of ' + steps.length + ' done</span>' +
      '<div class="bar"><span style="width:' + Math.round(n / steps.length * 100) + '%"></span></div><button class="btn link" data-action="hide-guide">Hide</button></div><ol class="steps2">';
    var nextShown = false, done = steps.filter(function (x) { return x.done; });
    if (done.length) h += '<li class="donerow">' + done.map(function (x) { return '<span>' + TILE_IC.tick + x.t + '</span>'; }).join('') + '</li>';
    steps.forEach(function (x) {
      if (x.done) return;
      var isNext = !nextShown; nextShown = true;
      h += '<li class="' + (isNext ? 'next' : '') + '">' + TILE_IC.todo + '<div><div class="strong">' + x.t + '</div><div class="small">' + x.s + '</div></div>' + (isNext ? x.b : '') + '</li>';
    });
    return h + '</ol></section>';
  }

  /* ----- Who owes me ----- */
  function viewDashboard() {
    var a = C.allocate(state), t = C.today();
    var owedTotal = 0, unpaidCount = 0, owing = [];
    Object.keys(a.students).forEach(function (sid) {
      var s = a.students[sid];
      if (s.owed > 0) { owedTotal += s.owed; unpaidCount += s.unpaidCount; owing.push({ id: sid, sum: s }); }
    });
    owing.sort(function (x, y) { return x.sum.oldestUnpaid < y.sum.oldestUnpaid ? -1 : x.sum.oldestUnpaid > y.sum.oldestUnpaid ? 1 : y.sum.owed - x.sum.owed; });
    var month = t.slice(0, 7), ty = C.taxYearOf(t);
    var mInc = C.income(state, { start: month + '-01', end: month + '-31' });
    var yInc = C.income(state, C.taxYearRange(ty));
    var out = { tool: toolTitle('Who owes me') + '<span class="grow"></span>' + addButtons() };
    out.sum = sumBar([['Owed', C.fmt(owedTotal)], ['Unpaid lessons', String(unpaidCount)]]);
    var h = '<div class="summary">' + IC.info + '<div><p class="big">' + (owedTotal > 0 ? 'You are owed <b class="owed">' + C.fmt(owedTotal) + '</b> for ' + plural(unpaidCount, 'lesson') + ' by ' + plural(owing.length, 'student') + '.' : (state.lessons.length ? 'Nobody owes you anything right now.' : 'Nothing added yet.')) + '</p>' +
      '<p class="line">Received in ' + esc(C.monthLabel(month).split(' ')[0]) + ': <b>' + C.fmt(mInc.received) + '</b> &nbsp;·&nbsp; This tax year (' + C.taxYearLabel(ty) + '): <b>' + C.fmt(yInc.received) + '</b></p></div></div>';
    if (!state.students.length) { out.main = h + welcome(); return out; }

    h += remindersBlock(a, t);
    h += todaysLessons(a, t);
    h += familiesBlock(a);
    h += '<section class="block" aria-labelledby="owe-h"><h2 class="block-h" id="owe-h">Students who owe you</h2>';
    if (!owing.length) h += '<div class="sheet auto"><div class="empty"><p>Everyone has paid.</p></div></div>';
    else {
      h += '<div class="sheet auto"><table class="g"><thead><tr>' + th('', 'rn') + th('Student') + th('Parent / guardian') + th('Unpaid lessons', 'num') + th('Oldest unpaid') + th('Waiting') + th('Owes you', 'num') + th('<span class="sr">Actions</span>') + '</tr></thead><tbody>';
      var tl = 0;
      owing.forEach(function (o, i) {
        var st = studentById(o.id); tl += o.sum.unpaidCount;
        h += '<tr>' + rn(i + 1) + '<td class="strong">' + '<button class="namebtn" data-action="student-card" data-id="' + esc(o.id) + '">' + esc(sname(o.id)) + '</button>' + '</td><td>' + esc(st && st.parent || '') + '</td>' +
          '<td class="num">' + o.sum.unpaidCount + '</td><td>' + esc(C.niceDate(o.sum.oldestUnpaid)) + '</td><td class="small">' + esc(ago(o.sum.oldestUnpaid)) + '</td>' +
          '<td class="num money f-unpaid">' + C.fmt(o.sum.owed) + '</td>' +
          '<td>' + (st && st.remindedAt ? '<span class="small">Reminded ' + esc(ago(st.remindedAt)) + '</span> ' : '') + '<button class="btn xs" data-action="remind" data-id="' + esc(o.id) + '">Send reminder</button> <button class="btn xs" data-action="invoice" data-id="' + esc(o.id) + '">Invoice</button> <button class="btn xs" data-action="pay-student" data-id="' + esc(o.id) + '">They paid</button></td></tr>';
      });
      h += '<tr class="total">' + rn('') + '<td>Total</td><td></td><td class="num">' + tl + '</td><td></td><td></td><td class="num">' + C.fmt(owedTotal) + '</td><td></td></tr>';
      h += '</tbody></table></div>';
    }
    h += '</section>';

    var credits = Object.keys(a.students).filter(function (sid) { return a.students[sid].credit > 0; });
    if (credits.length) {
      h += '<section class="block"><h2 class="block-h">Paid in advance <span class="r small">This credit is used up by their next lessons</span></h2><div class="sheet auto"><table class="g"><thead><tr>' + th('', 'rn') + th('Student') + th('Credit', 'num') + '</tr></thead><tbody>';
      credits.forEach(function (sid, i) { h += '<tr>' + rn(i + 1) + '<td class="strong">' + esc(sname(sid)) + '</td><td class="num money f-paid">' + C.fmt(a.students[sid].credit) + '</td></tr>'; });
      h += '</tbody></table></div></section>';
    }

    var recent = state.lessons.slice().sort(C.byDateThenCreated).reverse().slice(0, 8);
    h += '<section class="block"><h2 class="block-h">Recent lessons <a href="#lessons" class="r">See all lessons</a></h2>';
    if (!recent.length) h += '<div class="sheet auto"><div class="empty"><p>No lessons logged yet.</p><button class="btn primary" data-action="new-lesson">+ Log lesson</button></div></div>';
    else h += '<div class="sheet auto">' + lessonGrid(recent, a, { compact: true }) + '</div>';
    out.main = h + '</section>';
    return out;
  }

  function remindersBlock(a, t) {
    if (!state.settings.autoRemind) return '';
    var due = C.remindersDue(state, a, t, state.settings.remindAfter || 7);
    if (!due.length) return '';
    var h = '<section class="block" aria-labelledby="rem-h"><h2 class="block-h" id="rem-h">Reminders to send<span class="r">Unpaid for ' + (state.settings.remindAfter || 7) + '+ days</span></h2>' +
      '<div class="sheet auto"><table class="g"><thead><tr>' + th('Student') + th('Parent / guardian') + th('Owes', 'num') + th('Unpaid since') + th('Last reminder') + th('<span class="sr">Actions</span>') + '</tr></thead><tbody>';
    due.forEach(function (d) {
      h += '<tr><td class="strong">' + esc(d.student.name) + '</td><td>' + esc(d.student.parent) + '</td><td class="num money f-unpaid">' + C.fmt(d.owed) + '</td>' +
        '<td>' + esc(C.niceDate(d.since)) + ' <span class="small">(' + esc(ago(d.since)) + ')</span></td><td class="small">' + (d.student.remindedAt ? esc(ago(d.student.remindedAt)) : 'Never') + '</td>' +
        '<td><button class="btn xs primary" data-action="remind" data-id="' + esc(d.student.id) + '">Send reminder</button> <button class="btn link" data-action="skip-remind" data-id="' + esc(d.student.id) + '">Not now</button></td></tr>';
    });

  }
  function markReminded(sid) {

  function todaysLessons(a, t) {
    var d = dowOf(t);
    var list = activeStudents().filter(function (s) { return s.day === d; }).sort(function (x, y) { return (x.time || '99') < (y.time || '99') ? -1 : (x.time || '99') > (y.time || '99') ? 1 : byName(x, y); });
    var extra = state.lessons.filter(function (l) { return l.date === t && !list.some(function (s) { return s.id === l.studentId; }); });
    var h = '<section class="block" aria-labelledby="today-h"><h2 class="block-h" id="today-h">Today’s lessons <span class="r">' + esc(DAY_NAMES[d]) + '</span></h2>';
    if (!list.length && !extra.length) {
      return h + '<p class="small" style="margin:6px 0 0">No regular lessons on ' + DAY_NAMES[d] + 's. Set each student’s usual day on the <a href="#students">Students</a> page and they’ll show up here, ready to tick off.</p></section>';
    }
    if (V2 && view === 'home') {
      h += '<div class="tcards">';
      var card = function (s, l, sid, price) {
        var c = '<div class="tcard trow' + (l ? ' done' : '') + '"><div class="tc-time">' + esc(s && s.time || '—') + '</div><div class="tc-main"><div class="strong">' + esc(sname(sid)) + '</div><div class="tc-tags">' + subjectTag(s) + '<span class="small">' + C.fmt(price) + '</span></div></div><div class="tc-act">';
        if (l) c += '<span class="tagp c-green">Logged</span><button class="btn link" data-action="edit-lesson" data-id="' + esc(l.id) + '">Edit</button>' + paidBox(l, a);
        else c += '<button class="btn primary" data-action="log-today" data-id="' + esc(sid) + '">Log lesson</button>';
        return c + '</div></div>';
      };
      list.forEach(function (s) {
        var ls = state.lessons.filter(function (l) { return l.studentId === s.id && l.date === t; });
        h += card(s, ls[0], s.id, s.rate);
      });
      extra.forEach(function (l) { h += card(studentById(l.studentId), l, l.studentId, l.price); });
      return h + '</div></section>';
    }
    h += '<div class="sheet auto"><table class="g"><thead><tr>' + th('Time') + th('Student') + th('Subject') + th('Price', 'num') + th('Lesson') + th('Paid?') + '</tr></thead><tbody>';
    list.forEach(function (s) {
      var ls = state.lessons.filter(function (l) { return l.studentId === s.id && l.date === t; });
      h += '<tr class="trow"><td>' + esc(s.time || '') + '</td><td class="strong">' + esc(s.name) + '</td><td>' + subjectTag(s) + '</td><td class="num">' + C.fmt(s.rate) + '</td>';
      if (ls.length) h += '<td><span class="tagp c-green">Logged</span> <button class="btn link" data-action="edit-lesson" data-id="' + esc(ls[0].id) + '">Edit</button></td>' + paidCell(ls[0], a);
      else h += '<td><button class="btn xs primary" data-action="log-today" data-id="' + esc(s.id) + '">Log lesson</button></td><td class="small">Log it first</td>';
      h += '</tr>';
    });
    extra.forEach(function (l) {
      var s = studentById(l.studentId);
      h += '<tr class="trow"><td></td><td class="strong">' + esc(sname(l.studentId)) + '</td><td>' + subjectTag(s) + '</td><td class="num">' + C.fmt(l.price) + '</td><td><span class="tagp c-green">Logged</span> <button class="btn link" data-action="edit-lesson" data-id="' + esc(l.id) + '">Edit</button></td>' + paidCell(l, a) + '</tr>';
    });
    return h + '</tbody></table></div></section>';
  }

  function welcome() {
    return '<div class="welcome"><h2>Welcome to SoleTutor</h2><p class="small" style="margin:0">Keep track of your lessons and who has paid. Getting started takes a minute:</p>' +
      '<ol class="steps"><li>Add your students: their subject, level, usual lesson day and price.</li><li>After each lesson, tap “Log lesson” here or tap the day on the Register.</li><li>Tick “Paid?” when a parent pays you, by cash, card or bank transfer.</li></ol>' +
      '<div class="row" style="margin-top:14px"><button class="btn primary" data-action="new-student">+ Add your first student</button>' + (NOSAMPLE ? '' : '<button class="btn" data-action="sample">Try it with example data</button>') + '</div></div>';
  }

  /* ----- Lessons grid (shared) ----- */
  function paidCell(l, a) {
    var paid = Math.min(a.paid[l.id] || 0, l.price), st = C.lessonStatus(l, paid);
    return '<td class="in f-' + st + '">' + paidBox(l, a) + '</td>';
  }
  function paidBox(l, a) {
    var paid = Math.min(a.paid[l.id] || 0, l.price), st = C.lessonStatus(l, paid);
    var label = st === 'paid' ? 'Paid' : st === 'free' ? 'Free' : st === 'cancelled' ? 'Cancelled' : st === 'makeup' ? 'Make-up' : st === 'part' ? C.fmt(l.price - paid) + ' left' : 'Not paid';
    if (l.status === 'late' && st !== 'paid') label = 'Late cancel';

      (st === 'paid' || noPay ? ' checked' : '') + (noPay ? ' disabled title="' + (st === 'cancelled' ? 'Cancelled lesson: not charged' : st === 'makeup' ? 'Make-up lesson: free' : 'Free lesson: there’s nothing to pay') + '"' : '') + (st === 'part' ? ' data-part="1"' : '') +
      ' aria-label="Paid? ' + esc(sname(l.studentId) + ', ' + C.niceDate(l.date)) + '"><span class="tagp ' + st + '">' + label + '</span></label>';

        '<td class="num">' + l.duration + ' min</td><td class="num">' + C.fmt(l.price) + '</td>' + paidCell(l, a) +

    return h + '</tbody></table>';
  }

  /* ----- Lessons sheet ----- */
  function viewLessons() {
    var a = C.allocate(state);

    var mlist = Object.keys(months).sort().reverse();
    var list = state.lessons.filter(function (l) {
      if (filters.lStudent && l.studentId !== filters.lStudent) return false;

      if (filters.lStatus) {
        var st = C.lessonStatus(l, a.paid[l.id] || 0);
        if (filters.lStatus === 'unpaid' && st !== 'unpaid' && st !== 'part') return false;
        if (filters.lStatus === 'paid' && st !== 'paid' && st !== 'free') return false;
      }
      return true;
    }).sort(C.byDateThenCreated).reverse();
    var value = 0, left = 0;
    list.forEach(function (l) { value += l.price; left += Math.max(0, l.price - (a.paid[l.id] || 0)); });

      '<label class="inl">Student<select data-filter="lStudent">' + studentOptions(filters.lStudent, true) + '</select></label>' +
      '<label class="inl">Month<select data-filter="lMonth"><option value="">All</option>' + mlist.map(function (m) { return '<option value="' + m + '"' + (m === filters.lMonth ? ' selected' : '') + '>' + esc(C.monthLabel(m)) + '</option>'; }).join('') + '</select></label>' +
      '<label class="inl">Status<select data-filter="lStatus"><option value="">Any</option><option value="unpaid"' + (filters.lStatus === 'unpaid' ? ' selected' : '') + '>Unpaid / part</option><option value="paid"' + (filters.lStatus === 'paid' ? ' selected' : '') + '>Paid</option></select></label>' +

  /* ----- Income ----- */
  function taxYearsAvailable() {

  /* ----- Charts (inline SVG, one axis, thin marks, hover + keyboard tooltips) ----- */
  var CH = UI === 'v4' ? { dark: '#3CAB6E', light: '#5B7FC9', grid: '#26302B', base: '#3A4640', axis: '#9AA8A0', ink: '#E7EDE9', surface: '#151C18' }
    : { dark: '#0F7A4A', light: '#5CC48A', grid: '#E6EEE9', base: '#C9D6CE', axis: '#6B746F', ink: '#37352F', surface: '#fff' };
  /** Axis top that splits into 4 round ticks (e.g. 200 → 50s, 600 → 150s become 800 → 200s). */
  function niceMax(v) {
    if (v <= 0) return 400;
    var t = v / 4, p = Math.pow(10, Math.floor(Math.log10(t))), n = t / p;
    var steps = [1, 2, 2.5, 5, 10], step = 10;
    for (var i = 0; i < steps.length; i++) if (n <= steps[i]) { step = steps[i]; break; }
    return step * p * 4;
  }
  function shortGBP(pence) {
    var p = pence / 100;
    if (p >= 1000) return '£' + (p / 1000).toFixed(p >= 10000 ? 0 : 1).replace(/\.0$/, '') + 'k';
    return '£' + Math.round(p);
  }
  function tip(lines) { return esc(lines.join('\n')); }
  /** Rounded top corners only, anchored to the baseline. */
  function barPath(x, y, w, h, r) {
    if (h <= 0) return '';
    r = Math.min(r, w / 2, h);
    return 'M' + x + ',' + (y + h) + 'V' + (y + r) + 'Q' + x + ',' + y + ' ' + (x + r) + ',' + y + 'H' + (x + w - r) + 'Q' + (x + w) + ',' + y + ' ' + (x + w) + ',' + (y + r) + 'V' + (y + h) + 'Z';
  }
  function yAxis(W, M, ph, max) {
    var g = '';
    for (var i = 0; i <= 4; i++) {
      var v = max * i / 4, yy = M.t + ph - ph * i / 4;
      g += '<line x1="' + M.l + '" x2="' + (W - M.r) + '" y1="' + yy + '" y2="' + yy + '" stroke="' + (i ? CH.grid : CH.base) + '" stroke-width="1"/>' +
        '<text x="' + (M.l - 8) + '" y="' + (yy + 4) + '" text-anchor="end" font-size="11" fill="' + CH.axis + '">' + shortGBP(v) + '</text>';
    }
    return g;
  }
  function groupedBars(buckets, W, H, highlight) {
    var M = { l: 52, r: 8, t: 10, b: 26 }, pw = W - M.l - M.r, ph = H - M.t - M.b, n = buckets.length;
    var max = 0; buckets.forEach(function (b) { max = Math.max(max, b.value, b.received); });
    max = niceMax(max * 1.04);
    var gw = pw / n, bw = Math.min(n > 8 ? 18 : 34, (gw * 0.72 - 2) / 2), g = yAxis(W, M, ph, max);
    buckets.forEach(function (b, i) {
      var cx = M.l + gw * i + gw / 2, h1 = ph * b.value / max, h2 = ph * b.received / max;
      g += '<path d="' + barPath(cx - bw - 1, M.t + ph - h1, bw, h1, 4) + '" fill="' + CH.light + '"/>' +
        '<path d="' + barPath(cx + 1, M.t + ph - h2, bw, h2, 4) + '" fill="' + CH.dark + '"/>' +
        '<text x="' + cx + '" y="' + (H - 8) + '" text-anchor="middle" font-size="11" fill="' + (b.key && b.key === highlight ? CH.ink : CH.axis) + '"' + (b.key && b.key === highlight ? ' font-weight="600"' : '') + '>' + esc(b.label) + '</text>' +
        '<rect class="hit" x="' + (M.l + gw * i) + '" y="' + M.t + '" width="' + gw + '" height="' + ph + '" tabindex="0" role="img" ' + (b.key ? 'data-action="inc-goto" data-id="' + b.key + '" ' : '') +
        'aria-label="' + esc(b.title + ': lessons worth ' + C.fmt(b.value) + ', received ' + C.fmt(b.received) + ', ' + plural(b.lessons, 'lesson')) + '" ' +
        'data-tip="' + tip([b.title, 'Received: ' + C.fmt(b.received), 'Lessons worth: ' + C.fmt(b.value), plural(b.lessons, 'lesson') + ' taught'].concat(b.key ? ['Click to open this month'] : [])) + '"/>';
    });
    return '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="xMidYMid meet">' + g + '</svg>';
  }
  function singleBars(buckets, W, H, highlight) {
    var M = { l: 46, r: 8, t: 22, b: 26 }, pw = W - M.l - M.r, ph = H - M.t - M.b, n = buckets.length;
    var max = 0; buckets.forEach(function (b) { max = Math.max(max, b.received); });
    max = niceMax(max * 1.04);
    var gw = pw / n, bw = Math.min(22, gw * 0.6), g = yAxis(W, M, ph, max);
    buckets.forEach(function (b, i) {
      var cx = M.l + gw * i + gw / 2, hh = ph * b.received / max, on = b.key === highlight;
      g += '<path d="' + barPath(cx - bw / 2, M.t + ph - hh, bw, hh, 4) + '" fill="' + (on ? CH.dark : CH.light) + '"/>' +
        (on ? '<text x="' + cx + '" y="' + Math.max(12, M.t + ph - hh - 6) + '" text-anchor="middle" font-size="11.5" font-weight="600" fill="' + CH.ink + '">' + C.fmt(b.received) + '</text>' : '') +
        '<text x="' + cx + '" y="' + (H - 8) + '" text-anchor="middle" font-size="11" fill="' + (on ? CH.ink : CH.axis) + '"' + (on ? ' font-weight="600"' : '') + '>' + esc(b.label) + '</text>' +
        '<rect class="hit" x="' + (M.l + gw * i) + '" y="' + M.t + '" width="' + gw + '" height="' + ph + '" tabindex="0" role="img" data-action="inc-goto" data-id="' + b.key + '" ' +
        'aria-label="' + esc(b.title + ': received ' + C.fmt(b.received) + ', ' + plural(b.lessons, 'lesson')) + '" data-tip="' + tip([b.title, 'Received: ' + C.fmt(b.received), plural(b.lessons, 'lesson') + ' taught', 'Click to open this month']) + '"/>';
    });
    return '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="xMidYMid meet">' + g + '</svg>';
  }
  function monthChart(y, inc) {
    return groupedBars(C.taxYearMonths(y).map(function (m) {
      var r = inc.months[m] || { received: 0, lessons: 0, value: 0 };
      return { label: C.monthLabel(m).slice(0, 3), title: C.monthLabel(m), value: r.value, received: r.received, lessons: r.lessons };
    }), 720, 250);
  }
  function runningChart(y, inc) {
    var months = C.taxYearMonths(y), W = 460, H = 230, M = { l: 46, r: 14, t: 14, b: 24 };
    var pw = W - M.l - M.r, ph = H - M.t - M.b, cum = 0, pts = [];
    var t = C.today(), lastIdx = 11;
    months.forEach(function (m, i) { cum += (inc.months[m] || { received: 0 }).received; pts.push(cum); if (m > t.slice(0, 7)) lastIdx = Math.min(lastIdx, i - 1); });
    if (lastIdx < 0) lastIdx = 0;
    var max = niceMax(pts[11] * 1.04), step = pw / 11;
    var X = function (i) { return M.l + step * i; }, Y = function (v) { return M.t + ph - ph * v / max; };
    var g = yAxis(W, M, ph, max), line = '', area = '';
    for (var i = 0; i <= lastIdx; i++) { line += (i ? 'L' : 'M') + X(i).toFixed(1) + ',' + Y(pts[i]).toFixed(1); }
    area = line + 'L' + X(lastIdx).toFixed(1) + ',' + (M.t + ph) + 'L' + X(0) + ',' + (M.t + ph) + 'Z';
    g += '<path d="' + area + '" fill="' + CH.dark + '" opacity="0.10"/><path d="' + line + '" fill="none" stroke="' + CH.dark + '" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
    g += '<circle cx="' + X(lastIdx) + '" cy="' + Y(pts[lastIdx]) + '" r="4.5" fill="' + CH.dark + '" stroke="' + CH.surface + '" stroke-width="2"/>' +
      '<text x="' + Math.min(X(lastIdx) + 8, W - M.r) + '" y="' + (Y(pts[lastIdx]) - 8) + '" text-anchor="' + (lastIdx > 8 ? 'end' : 'start') + '" font-size="12" font-weight="600" fill="' + CH.ink + '">' + C.fmt(pts[lastIdx]) + '</text>';
    months.forEach(function (m, i) {
      if (i % 2 === 0 || i === 11) g += '<text x="' + X(i) + '" y="' + (H - 8) + '" text-anchor="middle" font-size="11" fill="' + CH.axis + '">' + C.monthLabel(m).slice(0, 3) + '</text>';
      if (i > lastIdx) return;
      g += '<g class="hitg"><line x1="' + X(i) + '" x2="' + X(i) + '" y1="' + M.t + '" y2="' + (M.t + ph) + '" stroke="' + CH.axis + '" stroke-width="1" stroke-dasharray="3 3"/>' +
        '<circle cx="' + X(i) + '" cy="' + Y(pts[i]) + '" r="4.5" fill="' + CH.dark + '" stroke="' + CH.surface + '" stroke-width="2"/>' +
        '<rect class="hit" x="' + (X(i) - step / 2) + '" y="' + M.t + '" width="' + step + '" height="' + ph + '" tabindex="0" role="img" aria-label="' + esc('By end of ' + C.monthLabel(m) + ': ' + C.fmt(pts[i]) + ' received') + '" data-tip="' + tip(['By end of ' + C.monthLabel(m), C.fmt(pts[i]) + ' received so far']) + '"/></g>';
    });
    return '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="xMidYMid meet">' + g + '</svg>';
  }
  function hbarChart(items, total, emptyText) {
    if (!items.length) return '<p class="small">' + esc(emptyText) + '</p>';
    var max = 0; items.forEach(function (it) { max = Math.max(max, it.value); });
    return '<div class="hbars">' + items.map(function (it) {
      var pct = max ? Math.max(1.5, it.value / max * 100) : 0, share = total ? Math.round(it.value / total * 100) : 0;
      return '<div class="hbar" tabindex="0" role="img" aria-label="' + esc(it.label + ': ' + C.fmt(it.value) + ', ' + share + '%') + '" data-tip="' + tip([it.label, C.fmt(it.value) + ' (' + share + '% of the year)'].concat(it.extra ? [it.extra] : [])) + '">' +
        '<span class="hl">' + esc(it.label) + '</span><span class="ht"><span class="hf" style="width:' + pct.toFixed(1) + '%"></span></span><span class="hv">' + C.fmt(it.value) + '<span class="small"> · ' + share + '%</span></span></div>';
    }).join('') + '</div>';
  }
  function topWithOther(items, n) {
    items.sort(function (a, b) { return b.value - a.value; });
    if (items.length <= n) return items;
    var rest = items.slice(n - 1), other = 0; rest.forEach(function (r) { other += r.value; });

  }
  function chartCard(title, sub, body, legend) {
    return '<section class="chartcard"><div class="chart-h"><div><h3>' + title + '</h3>' + (sub ? '<p class="small">' + sub + '</p>' : '') + '</div>' + (legend || '') + '</div>' + body + '</section>';
  }
  function LEGEND2() { return '<div class="clegend"><span><i style="background:' + CH.light + '"></i>Lessons worth</span><span><i style="background:' + CH.dark + '"></i>Received</span></div>'; }
  function monthlyCharts(ym, inc, per, last) {
    var p = ym.split('-').map(Number), days = new Date(p[0], p[1], 0).getDate(), mon = C.monthLabel(ym).split(' ')[0].slice(0, 3);

    for (var d = 1; d <= days; d += 7) {

  /* ----- Profit, tax set-aside and expenses ----- */
  function taxBlock(y, inc) {

  /* ----- Income forecast for a month ----- */
  function forecastMonth(ym) {
    var t = C.today(), start = ym + '-01', end = ym + '-31';
    if (t.slice(0, 7) !== ym) return null;
    var taught = 0; state.lessons.forEach(function (l) { if (C.inRange(l.date, { start: start, end: end })) taught += l.price; });
    var more = 0, count = 0;
    activeStudents().forEach(function (s) {
      if (s.day === null || s.day === undefined) return;
      for (var d = C.addDays(t, 1); d.slice(0, 7) === ym; d = C.addDays(d, 1)) if (dowOf(d) === s.day) { more += s.rate; count++; }
    });
    var today = 0; activeStudents().forEach(function (s) {
      if (s.day === dowOf(t) && !state.lessons.some(function (l) { return l.studentId === s.id && l.date === t; })) { today += s.rate; count++; }
    });
    return { taught: taught, expected: taught + more + today, upcoming: count };
  }

        });

          'delete': function () { return sb.from(T).delete().eq('user_id', userId).eq('key', key).then(function (r) { if (r.error) fail(r.error); }); }

  function matchCase(from, to) {
    if (from === from.toUpperCase() && /[A-Z]{2}/.test(from)) return to.toUpperCase();
    if (/^[A-Z]/.test(from) && /^[a-z]/.test(to)) return to[0].toUpperCase() + to.slice(1);
    return to;
  }
  function T(s) {
    if (DESK_RAW || typeof s !== 'string' || !s) return s;
    WORDS.forEach(function (w) {
      s = s.replace(w[0], function (m) {
        var to = typeof w[1] === 'function' ? w[1].apply(null, arguments) : m.replace(w[0], w[1]);
        return matchCase(m, to);
      });
    });
    return s;
  }
  var RELABEL_ATTRS = ['placeholder', 'title', 'aria-label', 'alt'];
  function relabel(root) {
    if (DESK_RAW || !root) return;
    var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null), n, list = [];
    while ((n = walker.nextNode())) list.push(n);
    list.forEach(function (tn) {
      var p = tn.parentNode; if (!p || p.nodeName === 'SCRIPT' || p.nodeName === 'STYLE') return;
      var v = tn.nodeValue, nv = T(v); if (nv === v) return;
      if (p.nodeName === 'OPTION' && !p.hasAttribute('value')) p.setAttribute('value', v);
      tn.nodeValue = nv;
      if (p.nodeName === 'TEXTAREA' && p.value === v) p.value = nv;
    });
    var els = root.querySelectorAll ? root.querySelectorAll('[placeholder],[title],[aria-label],[alt]') : [];
    Array.prototype.forEach.call(els, function (el) {
      RELABEL_ATTRS.forEach(function (a) { var v = el.getAttribute(a); if (v) { var nv = T(v); if (nv !== v) el.setAttribute(a, nv); } });
    });
  }
  function startRelabel() {
    if (DESK_RAW) return;
    document.title = T(document.title);
    relabel(document.body);
    var busy = false;
    new MutationObserver(function (muts) {
      if (busy) return; busy = true;
      try { muts.forEach(function (m) { if (m.type === 'characterData') relabel(m.target.parentNode); else m.addedNodes.forEach(function (nd) { relabel(nd.nodeType === 3 ? nd.parentNode : nd); }); }); }
      finally { busy = false; }
    }).observe(document.body, { childList: true, subtree: true, characterData: true });
  }

  var MON = { jan: 1, feb: 2, mar: 3, apr: 4, may: 5, jun: 6, jul: 7, aug: 8, sep: 9, oct: 10, nov: 11, dec: 12 };
  function bankDate(v) {
    v = String(v || '').trim(); var m, pad = function (n) { return ('0' + n).slice(-2); };
    if ((m = v.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))) return m[1] + '-' + pad(m[2]) + '-' + pad(m[3]);
    if ((m = v.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})/))) { var y = m[3].length === 2 ? '20' + m[3] : m[3]; return y + '-' + pad(m[2]) + '-' + pad(m[1]); }
    if ((m = v.match(/^(\d{1,2})[\s\-]([A-Za-z]{3})[A-Za-z]*[\s\-](\d{2,4})/)) && MON[m[2].toLowerCase()]) { var yy = m[3].length === 2 ? '20' + m[3] : m[3]; return yy + '-' + pad(MON[m[2].toLowerCase()]) + '-' + pad(m[1]); }

  var CAT_GUESS = [[/adobe|canva|figma|notion|software|subscription|microsoft|google ?workspace|dropbox|zoom|squarespace|wix|shopify|github/i, 'Software and subscriptions'],
    [/\bee\b|vodafone|\bo2\b|three|\bbt\b|virgin media|sky|giffgaff|broadband/i, 'Phone and internet'],
    [/trainline|tfl|uber|parking|national rail|train|bus|taxi|ryanair|easyjet/i, 'Travel (fares, parking)'],
    [/amazon|staples|ryman|currys|argos|screwfix|toolstation|b&q|wickes|ikea/i, 'Supplies and small equipment'],
    [/insurance|hiscox|simply business|course|udemy|training/i, 'Insurance and training'],
    [/facebook|meta|instagram|google ads|linkedin|vistaprint|advert/i, 'Advertising'],
    [/rent|wework|regus|desk|studio hire|office/i, 'Workspace and rent']];

  function guessClient(desc, amount, owes) {
    var d = String(desc).toLowerCase(), best = '';

      if (names.some(function (n) { n = n.toLowerCase(); return d.indexOf(n) >= 0 || n.split(/\s+/).some(function (w) { return w.length >= 4 && d.indexOf(w) >= 0; }); })) best = s.id;
    });

  }
  function readStatement(text) {
    var rows = parseCSV(text); if (rows.length < 2) return { err: 'That file looks empty. Download your statement from your bank as a CSV file and try again.' };
    var hi = 0;
    for (var r = 0; r < Math.min(rows.length, 15); r++) if (rows[r].some(function (c) { return /date/i.test(c); })) { hi = r; break; }
    var head = rows[hi].map(function (h) { return String(h).trim().toLowerCase(); });
    var col = function (re) { for (var i = 0; i < head.length; i++) if (re.test(head[i])) return i; return -1; };
    var c = { date: col(/date/), desc: [/desc/, /details|narrative|payee|particulars|memo/, /reference|name/, /^transaction$|transaction desc/].reduce(function (f, re) { return f >= 0 ? f : col(re); }, -1), amt: col(/^amount|^value|amount \(/), inn: col(/paid in|credit|money in|^in\b|received/), out: col(/paid out|debit|money out|^out\b|spent/) };
    if (c.date < 0 || (c.amt < 0 && c.inn < 0 && c.out < 0)) return { err: 'Quickly couldn’t find the date and amount columns. Check the file is a bank statement saved as CSV.' };

      if (!amt) return;
      list.push({ date: d, desc: c.desc >= 0 ? String(row[c.desc] || '').trim().slice(0, 120) : '', amount: amt });

  }

  function shrinkImage(file) {
    return new Promise(function (ok, bad) {
      if (!file || !/^image\//.test(file.type)) return bad(new Error('That file isn’t a photo. Choose a JPG or PNG picture of the receipt.'));
      var r = new FileReader();
      r.onerror = function () { bad(new Error('The photo couldn’t be read. Try taking it again.')); };
      r.onload = function () {
        var img = new Image();
        img.onerror = function () { bad(new Error('The photo couldn’t be opened. Try a JPG or PNG.')); };
        img.onload = function () {
          var max = 1100, sc = Math.min(1, max / Math.max(img.width, img.height));
          var c = document.createElement('canvas'); c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
          var g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
          var q = 0.7, out = c.toDataURL('image/jpeg', q);
          while (out.length > 500000 && q > 0.3) { q -= 0.15; out = c.toDataURL('image/jpeg', q); }
          ok(out);
        };
        img.src = r.result;
      };
      r.readAsDataURL(file);
    });
  }

  function parseCSV(text) {
    var rows = [], row = [], cell = '', q = false, i, ch;
    text = String(text).replace(/^﻿/, '');
    var sep = (text.split('\n')[0].match(/;/g) || []).length > (text.split('\n')[0].match(/,/g) || []).length ? ';' : ',';
    for (i = 0; i < text.length; i++) {
      ch = text[i];

      else if (ch === '"') q = true;
      else if (ch === sep) { row.push(cell); cell = ''; }

      else cell += ch;
    }

  }

  function reportRange(kind) {

    if (kind === '3m') return { start: C.addDays(t, -91), end: t, label: 'the last 3 months' };
    if (kind === 'year') { var y = C.taxYearOf(t), r = C.taxYearRange(y); return { start: r.start, end: r.end, label: 'the ' + C.taxYearLabel(y) + ' year' }; }
    return { start: ym + '-01', end: ym + '-31', label: C.monthLabel(ym) };
  }

    return { r: r, ls: ls, taught: ls.filter(function (l) { return l.status !== 'cancelled' && l.status !== 'late'; }), missed: ls.filter(function (l) { return l.status === 'cancelled' || l.status === 'late'; }) };

    var form = $('dlg-form');
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      try { submitDialog(); } catch (err) { oops(err); }
    });

      Array.prototype.forEach.call(form.querySelectorAll('[aria-invalid]'), function (x) { x.removeAttribute('aria-invalid'); });
      Array.prototype.forEach.call(form.querySelectorAll('.ferr'), function (x) { x.remove(); });
      var err = onSubmit ? onSubmit(form) : null;
      if (err && typeof err === 'object') {
        var fld = form.elements[err.field];
        if (fld) {
          fld.setAttribute('aria-invalid', 'true');
          var m = document.createElement('span'); m.className = 'ferr'; m.textContent = err.msg;
          fld.insertAdjacentElement('afterend', m);
          fld.focus(); if (fld.scrollIntoView) fld.scrollIntoView({ block: 'center' });
        }
        $('dlg-err').textContent = fld ? '' : err.msg; return;
      }
      if (err) { $('dlg-err').textContent = err; if ($('dlg-err').scrollIntoView) $('dlg-err').scrollIntoView({ block: 'nearest' }); return; }
      closeDialog();
    }
    try { dlg.showModal(); } catch (e) { dlg.setAttribute('open', ''); }
    var first = dlg.querySelector('[autofocus]') || dlg.querySelector('input,select,textarea');
    if (first) first.focus();
  }

      toast('Copied. Paste it into your message.');

      try { if (document.execCommand('copy')) return ok(); } catch (e) { /* ignore */ }
      if (btn) btn.textContent = 'Press Ctrl+C to copy';
      warn('Your browser blocked copying. The text is selected, so press Ctrl+C (or ⌘C on a Mac) to copy it.');
    };
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(ok, fail);
      else fail();
    } catch (e) { fail(); }
  }

  function offerFile(filename, text) {
    if (!/\.json$/.test(filename)) { text = T(text); filename = T(filename); }
    var api = window.claude;
    var showText = function () {
      openDialog('Copy your file', '<p class="small" style="margin-top:0">Downloading isn’t available here, so copy the text below and save it as <strong>' + esc(filename) + '</strong>.</p><textarea name="out" rows="12" class="mono" readonly>' + esc(text) + '</textarea>',
        '<button type="button" class="btn" data-close>Close</button><button type="button" class="btn primary" data-action="copy-out">Copy</button>', null);
    };
    if (!api || typeof api.use !== 'function') {
      var inFrame = false; try { inFrame = window.self !== window.top; } catch (e) { inFrame = true; }
      if (inFrame) return showText();
      try {
        var type = /\.html$/.test(filename) ? 'text/html' : /\.ics$/.test(filename) ? 'text/calendar' : /\.json$/.test(filename) ? 'application/json' : 'text/csv';
        var url = URL.createObjectURL(new Blob([text], { type: type + ';charset=utf-8' }));
        var a = document.createElement('a'); a.href = url; a.download = filename; document.body.appendChild(a); a.click();
        setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 1000);
        toast('Downloaded ' + filename); return;
      } catch (err) { return showText(); }
    }
    api.use('downloads').then(function (dl) {
      if (!dl) return showText();
      return dl.save({ filename: filename, data: text }).then(function (r) { if (r && r.status === 'saved') toast('Saved ' + filename); }, function (e) {
        var code = e && e.code;
        if (code === 'declined') return;
        if (code === 'rate_limited') return warn('Too many downloads in a row. Wait a few seconds and press the button again.');
        showText();
      });
    }, showText);
  }

    var S = [
      { name: 'Amelia Wright', parent: '', rate: 1250, off: 0, subject: 'Dog walking', level: 'Regular', time: '09:00' },

  function deleteStudent(id) {
    var s = studentById(id); if (!s) return;
    var ls = state.lessons.filter(function (l) { return l.studentId === id; });
    var ps = state.payments.filter(function (p) { return p.studentId === id; });
    closeDialog();
    var msg = ls.length || ps.length ? 'This also deletes their ' + plural(ls.length, 'lesson') + ' and ' + plural(ps.length, 'payment') + ', so they disappear from your income totals. To keep their history, archive them instead. This can’t be undone.' : 'This can’t be undone.';
    confirmBox('Delete ' + s.name + '?', msg, 'Delete student', true).then(function (yes) {
      if (!yes) return;
      var keys = ['profile'];
      ls.forEach(function (l) { keys.push(monthKey(l.date)); });
      ps.forEach(function (p) { keys.push(monthKey(p.date)); });
      state.students = state.students.filter(function (x) { return x.id !== id; });
      state.lessons = state.lessons.filter(function (l) { return l.studentId !== id; });
      state.payments = state.payments.filter(function (p) { return p.studentId !== id; });
      if (filters.lStudent === id) filters.lStudent = '';
      if (filters.pStudent === id) filters.pStudent = '';
      Store.persist(uniq(keys)); render(); toast(s.name + ' deleted');
    });
  }
  function deleteLesson(id) {
    var l = lessonById(id); if (!l) return;
    var snap = snapshot(), keys = [monthKey(l.date)];
    state.payments.forEach(function (p) { if (p.lessonId === id) { p.lessonId = null; keys.push(monthKey(p.date)); } });
    state.lessons = state.lessons.filter(function (x) { return x.id !== id; });
    Store.persist(uniq(keys)); render(); toast('Lesson deleted', undoer(snap));
  }
  function deletePayment(id) {
    var p = paymentById(id); if (!p) return;
    var snap = snapshot();

    Store.persist([monthKey(p.date)]); render(); toast('Payment deleted', undoer(snap));

  var pendingPaid = null;
  function finishPaid(method) {
    var l = lessonById(pendingPaid); pendingPaid = null; closeDialog();
    if (!l || METHODS.indexOf(method) < 0) return;
    var a = C.allocate(state), rem = l.price - Math.min(a.paid[l.id] || 0, l.price);
    if (rem <= 0) return;
    var snap = snapshot(), date = C.today();
    state.payments.push({ id: C.uid('p'), studentId: l.studentId, date: date, amount: rem, method: method, lessonId: l.id, note: '', createdAt: Date.now() });
    Store.persist([monthKey(date)]); render();
    confetti();
    toast(sname(l.studentId) + ', ' + C.niceDate(l.date) + ': paid ' + C.fmt(rem) + ' by ' + method.toLowerCase(), undoer(snap));
  }
  function changeQty(id, delta) {
    var l = lessonById(id); if (!l) return;
    var q = C.qtyOf(l), nq = q + delta;
    if (nq < 1) { warn('A lesson can’t be fewer than 1. To remove it completely, press Delete.'); return; }
    if (nq > 20) { warn('That’s the most for one entry (20). Log another lesson for more.'); return; }
    var snap = snapshot(), per = Math.round(l.price / q);
    l.qty = nq; l.price = per * nq;
    Store.persist([monthKey(l.date)]); render();
    toast(sname(l.studentId) + ', ' + C.niceDate(l.date) + ': ' + plural(nq, 'lesson') + ', ' + C.fmt(l.price), undoer(snap));
  }
  function logOn(sid, date) {
    var s = studentById(sid); if (!s || !C.isDate(date)) return;
    var snap = snapshot();
    state.lessons.push({ id: C.uid('l'), studentId: sid, date: date, price: s.rate, duration: s.duration, note: '', createdAt: Date.now() });
    Store.persist([monthKey(date)]); render();
    toast('Lesson logged: ' + s.name + ', ' + C.niceDate(date) + ', ' + C.fmt(s.rate), undoer(snap));
  }
  function logToday(sid) {
    var s = studentById(sid); if (!s) return;
    var snap = snapshot(), t = C.today();
    state.lessons.push({ id: C.uid('l'), studentId: sid, date: t, price: s.rate, duration: s.duration, note: '', createdAt: Date.now() });
    Store.persist([monthKey(t)]); render();

  }
  function togglePaid(id, checked) {
    var l = lessonById(id); if (!l) return;

        METHODS.map(function (m) { return '<button type="button" class="btn paym' + (m === def ? ' primary' : '') + '" data-action="pay-method" data-method="' + m + '"' + (m === def ? ' autofocus' : '') + '>' + m + '</button>'; }).join('') + '</div>',

  window.__stSample = function () { loadSample(); }; // used by automated checks only
  function loadSample() {

  }
  function wipe() {
    confirmBox('Delete all your data?', 'All students, lessons and payments will be deleted. Download a backup first if you might need them. This can’t be undone.', 'Delete everything', true).then(function (y) {
      if (!y) return;

      filters.lStudent = filters.pStudent = filters.lMonth = '';

    });

  function onQa(e) {
    var path = e.target.getAttribute && e.target.getAttribute('data-qa');
    if (!path) return false;
    var parts = path.split('.'), group = qa[parts[0]], field = parts[1];
    group[field] = e.target.value;
    if (path === 'lesson.price') qa.lesson.priceTouched = true;
    if (path === 'lesson.qty' && !qa.lesson.priceTouched) {
      var qs = studentById(qa.lesson.studentId), qn = parseInt(e.target.value, 10);
      if (qs && qn >= 1 && qn <= 20) {
        qa.lesson.price = C.plain(qs.rate * qn);
        var pin = document.querySelector('[data-qa="lesson.price"]'); if (pin) pin.value = qa.lesson.price;
      }
    }
    if (path === 'payment.amount') qa.payment.amountTouched = true;
    if (e.type === 'change' && path === 'lesson.studentId') {
      var keepPrice = qa.lesson.priceTouched ? qa.lesson.price : null;
      setQaLessonStudent(e.target.value);
      if (keepPrice !== null) { qa.lesson.price = keepPrice; qa.lesson.priceTouched = true; }
      focusAfter = '[data-qa="lesson.studentId"]'; render();
    }
    if (e.type === 'change' && path === 'payment.studentId') {
      var keepAmt = qa.payment.amountTouched ? qa.payment.amount : null;
      setQaPaymentStudent(e.target.value);
      if (keepAmt !== null) { qa.payment.amount = keepAmt; qa.payment.amountTouched = true; }
      focusAfter = '[data-qa="payment.studentId"]'; render();
    }
    return true;
  }

  function onChange(e) {
    if (onQa(e)) return;
    var f = e.target.getAttribute('data-filter');
    if (f) {
      if (f === 'archived') filters.archived = e.target.checked;
      else if (f === 'taxYear') filters.taxYear = parseInt(e.target.value, 10);
      else filters[f] = e.target.value;
      render();
      var again = document.querySelector('[data-filter="' + f + '"]'); if (again) again.focus();
      return;
    }
    if (e.target.getAttribute('data-action-change') === 'theme') {
      state.settings.theme = e.target.value; Store.persist(['profile']); render();
      var picked = document.querySelector('input[name=theme][value="' + e.target.value + '"]'); if (picked) picked.focus();
      toast('Colour: ' + themeLabel(e.target.value)); return;
    }
    if (e.target.getAttribute('data-action-change') === 'toggle-paid') { togglePaid(e.target.getAttribute('data-id'), e.target.checked); return; }
    if (e.target.getAttribute('data-action-change') === 'restore') {
      var file = e.target.files && e.target.files[0]; if (!file) return;
      var reader = new FileReader();
      reader.onload = function () {
        var parsed;
        try { parsed = C.normalise(JSON.parse(String(reader.result))); }
        catch (err) { warn('That file isn’t a SoleTutor backup. Choose the .json file you downloaded from Settings → Full backup.'); e.target.value = ''; return; }
        confirmBox('Restore this backup?', 'It has ' + plural(parsed.students.length, 'student') + ', ' + plural(parsed.lessons.length, 'lesson') + ' and ' + plural(parsed.payments.length, 'payment') + '. It will replace everything currently in SoleTutor.', 'Restore backup', true).then(function (y) {
          e.target.value = '';
          if (!y) return;
          if (!parsed.settings.tutorName) parsed.settings.tutorName = state.settings.tutorName;
          replaceAll(parsed); toast('Backup restored'); go('home');
        });
      };

      reader.readAsText(file);
    }
  }

  /** Explains a price we couldn't read, quoting what was typed. */
  function priceMsg(typed, what) {
    typed = String(typed || '').trim();
    return typed ? 'SoleTutor couldn’t read “' + typed.slice(0, 30) + '” as an amount. Type just the number, for example 30 or 27.50.' : 'The ' + what + ' box is empty. Type ' + (what === 'amount paid' ? 'how much they paid' : 'the ' + what) + ', for example 30.';

  function bad(form, name, msg) {

      if (price === null) return bad(form, 'price', priceMsg(v('price'), 'price'));

      state.lessons.push(nl);

    } else if (kind === 'qa-payment') {
      var psid = v('studentId'), pdate = v('date'), amt = C.toPence(v('amount'));

      state.payments.push({ id: C.uid('p'), studentId: psid, date: pdate, amount: amt, method: METHODS.indexOf(v('method')) >= 0 ? v('method') : 'Other', lessonId: null, note: v('note'), createdAt: Date.now() });
      Store.persist([monthKey(pdate)]);
      qa.payment.note = ''; qa.payment.date = pdate; setQaPaymentStudent(psid);

-direction:column;align-items:flex-start}.fc-num{align-items:flex-start;text-align:left}.iv-wrap .invoice{padding:18px}}@media print{body.printing-invoice *{visibility:hidden!important}body.printing-invoice #dlg .invoice,body.printing-invoice #dlg .invoice *{visibility:visible!important}body.printing-invoice #dlg .invoice{position:fixed;left:0;top:0;width:100%;max-width:none;box-shadow:none}}';
    var firstDesign = document.querySelector('style[id^="design"]'); if (firstDesign) document.head.insertBefore(ivs, firstDesign); else document.head.appendChild(ivs);
